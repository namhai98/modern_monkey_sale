    <title>Modern Monkey — Maison</title>
    <script>
      // Apply the stored theme before first paint so a shopper who picked
      // light never sees a dark flash. Dark is the default (see ThemeContext).
      (function () {
        try {
          if (localStorage.getItem('mms_theme') === 'light') {
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          /* keep the dark default */
        }
      })();
    </script>
