# Render Blueprint — Modern Monkey API (Express, in server/).
# New > Blueprint in the Render dashboard, point it at this repo, then fill in
# the values marked `sync: false` (see DEPLOY.md). PostgreSQL is on Neon, not
# Render, so only a web service is defined here.

services:
  - type: web
    name: modern-monkey-sale-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Neon pooled connection string, e.g.
      # postgresql://user:pass@ep-xxx-pooler.<region>.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Auth
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: PASSWORD_RESET_TTL_MIN
        value: "30"

      # Your Netlify site URL — used for CORS and password-reset links.
      # e.g. https://modern-monkey-sale.netlify.app
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_URL
        sync: false

      # Absolute public base for uploaded product images. Set to this service's
      # own URL + /media so image URLs are absolute (no Netlify proxy hop):
      #   https://modern-monkey-sale-api.onrender.com/media
      # NOTE: the free plan's disk is ephemeral — uploads are lost on restart.
      # For persistence use STORAGE_PROVIDER=s3 with an R2/S3 bucket instead.
      - key: STORAGE_PUBLIC_URL
        sync: false

      # Optional: SMTP for password-reset email. If unset, reset links are
      # written to the Render logs instead.
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: MAIL_FROM
      #   value: Modern Monkey Sale <no-reply@example.com>
