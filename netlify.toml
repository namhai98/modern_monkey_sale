# Netlify — Modern Monkey storefront (Vite SPA in client/).
#
# The API and PostgreSQL run elsewhere (Render + Neon). Netlify proxies
# /api/* to the Render service so the browser only ever talks to the Netlify
# origin: no CORS, and the httpOnly refresh-token cookie stays first-party.

[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── API proxy ────────────────────────────────────────────────────────────────
# Points at the Render service (see render.yaml / DEPLOY.md).
[[redirects]]
  from   = "/api/*"
  to     = "https://modern-monkey-sale-api.onrender.com/api/:splat"
  status = 200
  force  = true

# ── Uploaded product images ──────────────────────────────────────────────────
# The API stores optimised WebP variants and returns "/media/..." URLs. Proxy
# them to the backend so they resolve on the Netlify origin. (For a CDN / S3
# setup, set STORAGE_PUBLIC_URL on the backend to an absolute URL and this
# rule becomes a no-op.)
[[redirects]]
  from   = "/media/*"
  to     = "https://modern-monkey-sale-api.onrender.com/media/:splat"
  status = 200
  force  = true

# ── SPA fallback ─────────────────────────────────────────────────────────────
# Every other path serves the app shell so React Router can handle deep links.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
